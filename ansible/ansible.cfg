[defaults]
inventory = inventory.local.yml
roles_path = roles
retry_files_enabled = False
# Fleet nodes are reinstalled from time to time; accept-new keeps first
# contact quiet without blindly trusting a changed key.
host_key_checking = True

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
